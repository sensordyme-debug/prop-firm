name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Safety gate — order transmission must stay disabled
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from config import AppConfig
          from execution.broker import ExecutionNotEnabled, grant_execution
          cfg = AppConfig()
          assert cfg.dry_run is True, "DRY_RUN must default true"
          assert cfg.live_trading_enabled is False, "LIVE_TRADING must default false"
          assert cfg.execution_mode.may_transmit is False
          try:
              grant_execution()
              raise SystemExit("FAIL: execution capability was granted")
          except ExecutionNotEnabled:
              pass
          print("safety gate OK: transmission disabled, DRY_RUN default true")
          PY
